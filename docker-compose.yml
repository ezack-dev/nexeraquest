version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexeraquest-postgres
    restart: always
    environment:
      POSTGRES_DB: nexeraquest
      POSTGRES_USER: nexera_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexerapassword2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexera_user -d nexeraquest"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexeraquest-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexeraquest-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://nexera_user:${DB_PASSWORD:-nexerapassword2026}@postgres:5432/nexeraquest
      - JWT_SECRET=${JWT_SECRET:-nexeraquest_dev_jwt_secret_change_in_production_key_443}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-NexeraQuestBot}
      - TELEGRAM_MINI_APP_URL=${TELEGRAM_MINI_APP_URL:-https://t.me/NexeraQuestBot/app}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
